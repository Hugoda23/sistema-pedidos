# Desarrollo:  docker compose up -d --build
# Frontend http://localhost:5180 · API http://localhost:8120/api · Postgres localhost:5445

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  restart: unless-stopped
  volumes:
    - ./backend:/var/www/html
  depends_on:
    db:
      condition: service_healthy
  networks: [pedidos]

services:
  app:
    <<: *php
    container_name: pedidos_app

  queue:
    <<: *php
    container_name: pedidos_queue
    command: php artisan queue:work --tries=3 --sleep=2

  scheduler:
    <<: *php
    container_name: pedidos_scheduler
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    container_name: pedidos_nginx
    restart: unless-stopped
    ports:
      - "8120:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [pedidos]

  db:
    image: postgres:16-alpine
    container_name: pedidos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: secret
    ports:
      - "5445:5432"
    volumes:
      - pedidos_db:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pedidos]

  frontend:
    image: node:20-alpine
    container_name: pedidos_frontend
    restart: unless-stopped
    working_dir: /app
    user: "1000:1000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY: http://pedidos_nginx
    ports:
      - "5180:5173"
    volumes:
      - ./frontend:/app
    depends_on: [nginx]
    networks: [pedidos]

  # whatsapp-web.js NO es oficial: WhatsApp puede limitar un número que lo use.
  # Cada usuario vincula el suyo desde «Mi WhatsApp»; cada sesión es un Chromium (~250-500 MB).
  whatsapp:
    build:
      context: .
      dockerfile: docker/whatsapp/Dockerfile
    container_name: pedidos_whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_PORT: 3000
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-dev-cambiame}
      WHATSAPP_COUNTRY_CODE: ${WHATSAPP_COUNTRY_CODE:-502}
    volumes:
      - pedidos_whatsapp:/data
    shm_size: 512m
    # Tope para que muchas sesiones abiertas nunca dejen sin memoria al resto del servidor.
    mem_limit: 3g
    networks: [pedidos]

volumes:
  pedidos_db:
  pedidos_whatsapp:

networks:
  pedidos:
