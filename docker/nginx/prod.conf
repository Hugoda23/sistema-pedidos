# Producción: el TLS lo termina el nginx de Taller-sis; aquí llega HTTP plano.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    root /usr/share/nginx/html;

    # Vuelve a resolver pedidos_app si cambia de IP tras un rebuild.
    resolver 127.0.0.11 valid=10s;

    location /api {
        set $php pedidos_app:9000;
        include fastcgi_params;
        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier otra ruta devuelve la SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
